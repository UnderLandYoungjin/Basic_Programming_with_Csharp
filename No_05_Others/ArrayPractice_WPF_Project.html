<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>C# 배열 실습 - WPF 프로젝트 미리보기</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1e1e2e;color:#cdd6f4;min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:#181825;padding:8px 16px;font-size:13px;color:#a6adc8;border-bottom:1px solid #313244;display:flex;align-items:center;gap:12px}
.top-bar .dot{width:10px;height:10px;border-radius:50%}
.dot-r{background:#f38ba8}.dot-y{background:#f9e2af}.dot-g{background:#a6e3a1}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:#181825;border-right:1px solid #313244;padding:12px 0;flex-shrink:0}
.sidebar h3{padding:8px 16px;font-size:12px;color:#585b70;text-transform:uppercase;letter-spacing:1px}
.sidebar button{display:block;width:100%;text-align:left;padding:10px 16px;background:none;border:none;color:#bac2de;font-size:13px;cursor:pointer;transition:all .15s}
.sidebar button:hover{background:#313244;color:#cdd6f4}
.sidebar button.active{background:#45475a;color:#cba6f7;border-left:3px solid #cba6f7;font-weight:600}
.content{flex:1;padding:24px;overflow-y:auto}
.content h2{font-size:20px;color:#cba6f7;margin-bottom:6px}
.content .desc{font-size:13px;color:#a6adc8;margin-bottom:20px;line-height:1.6}
.code-block{background:#11111b;border:1px solid #313244;border-radius:8px;padding:16px;font-family:'Cascadia Code','Fira Code',monospace;font-size:13px;line-height:1.7;margin-bottom:16px;overflow-x:auto;white-space:pre}
.kw{color:#cba6f7}.tp{color:#f9e2af}.str{color:#a6e3a1}.cm{color:#585b70}.num{color:#fab387}.fn{color:#89b4fa}.op{color:#89dceb}
.panel{background:#181825;border:1px solid #313244;border-radius:10px;padding:20px;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:600;color:#f9e2af;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.array-vis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;min-height:48px;align-items:flex-end}
.arr-cell{min-width:48px;height:48px;background:#313244;border:2px solid #45475a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#cdd6f4;transition:all .3s;position:relative}
.arr-cell.highlight{border-color:#cba6f7;background:#45475a;transform:scale(1.1)}
.arr-cell.sorted{border-color:#a6e3a1;background:#1e3a2a}
.arr-cell .idx{position:absolute;bottom:-18px;font-size:10px;color:#585b70}
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:#cba6f7;color:#1e1e2e}.btn-primary:hover{background:#b4befe}
.btn-danger{background:#f38ba8;color:#1e1e2e}.btn-danger:hover{background:#eba0ac}
.btn-info{background:#89b4fa;color:#1e1e2e}.btn-info:hover{background:#74c7ec}
.btn-success{background:#a6e3a1;color:#1e1e2e}.btn-success:hover{background:#94e2d5}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input[type=number],input[type=text]{background:#11111b;border:1px solid #45475a;border-radius:6px;padding:8px 12px;color:#cdd6f4;font-size:14px;width:80px;outline:none}
input:focus{border-color:#cba6f7}
.log{background:#11111b;border:1px solid #313244;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;color:#a6adc8;max-height:150px;overflow-y:auto;line-height:1.8}
.log .ok{color:#a6e3a1}.log .err{color:#f38ba8}.log .info{color:#89b4fa}
.flex-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
label{font-size:13px;color:#a6adc8}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-int{background:#313244;color:#f9e2af}
.tag-str{background:#313244;color:#a6e3a1}
.result-box{padding:12px 16px;border-radius:8px;margin-top:12px}
.result-ok{background:#1e3a2a;border:1px solid #a6e3a1;color:#a6e3a1}
.result-err{background:#3a1e1e;border:1px solid #f38ba8;color:#f38ba8}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid #313244;padding-bottom:8px}
.tab{padding:6px 14px;border-radius:6px 6px 0 0;background:none;border:none;color:#a6adc8;font-size:13px;cursor:pointer}
.tab.active{background:#313244;color:#cba6f7;font-weight:600}
</style>
</head>
<body>
<div class="top-bar">
  <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
  <span>C# 배열(Array) 실습 프로젝트 — 한국폴리텍대학 AI소프트웨어융합</span>
</div>
<div class="main">
  <div class="sidebar">
    <h3>실습 메뉴</h3>
    <button class="active" onclick="showPage('p1')">📦 배열 선언/초기화</button>
    <button onclick="showPage('p2')">🔍 요소 접근/수정</button>
    <button onclick="showPage('p3')">🔄 반복문 순회</button>
    <button onclick="showPage('p4')">📊 배열 정렬</button>
    <button onclick="showPage('p5')">🔎 배열 검색</button>
    <button onclick="showPage('p6')">🧪 종합 실습</button>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const pages={};

// ========== 1. 배열 선언/초기화 ==========
pages.p1=function(){return `
<h2>📦 1. 배열 선언과 초기화</h2>
<p class="desc">C#에서 배열을 선언하고 초기화하는 방법을 실습합니다. 배열은 <b>같은 타입</b>의 데이터를 연속된 메모리에 저장하는 자료구조입니다.</p>

<div class="panel">
  <div class="panel-title">💡 C# 코드 예시</div>
  <div class="code-block"><span class="cm">// 방법 1: 크기만 지정</span>
<span class="tp">int</span>[] numbers = <span class="kw">new</span> <span class="tp">int</span>[<span class="num">5</span>];

<span class="cm">// 방법 2: 초기값과 함께</span>
<span class="tp">int</span>[] scores = <span class="kw">new</span> <span class="tp">int</span>[] { <span class="num">85</span>, <span class="num">92</span>, <span class="num">78</span>, <span class="num">95</span>, <span class="num">88</span> };

<span class="cm">// 방법 3: 간단하게</span>
<span class="tp">int</span>[] ages = { <span class="num">20</span>, <span class="num">22</span>, <span class="num">19</span>, <span class="num">25</span>, <span class="num">21</span> };

<span class="cm">// 방법 4: string 배열</span>
<span class="tp">string</span>[] names = { <span class="str">"김철수"</span>, <span class="str">"이영희"</span>, <span class="str">"박민수"</span> };</div>
</div>

<div class="panel">
  <div class="panel-title">🎮 직접 만들어보기</div>
  <div class="flex-row">
    <label>배열 크기:</label>
    <input type="number" id="arrSize" value="5" min="1" max="10" style="width:60px"/>
    <label>타입:</label>
    <select id="arrType" style="background:#11111b;border:1px solid #45475a;border-radius:6px;padding:8px;color:#cdd6f4;font-size:13px">
      <option value="int">int</option>
      <option value="string">string</option>
    </select>
    <button class="btn btn-primary" onclick="createArr()">배열 생성</button>
    <button class="btn btn-info" onclick="fillRandom()">랜덤 채우기</button>
  </div>
  <div class="array-vis" id="vis1"></div>
  <div class="flex-row">
    <label>인덱스:</label>
    <input type="number" id="setIdx" value="0" min="0" style="width:60px"/>
    <label>값:</label>
    <input type="text" id="setVal" placeholder="값 입력" style="width:100px"/>
    <button class="btn btn-success" onclick="setArrVal()">값 넣기</button>
  </div>
  <div class="log" id="log1"></div>
</div>
`};

let arr1=[];let arr1Type='int';
window.createArr=function(){
  const size=parseInt(document.getElementById('arrSize').value)||5;
  arr1Type=document.getElementById('arrType').value;
  arr1=new Array(size).fill(arr1Type==='int'?0:'');
  renderArr1();
  log1(`✅ ${arr1Type}[${size}] 배열이 생성되었습니다. (기본값: ${arr1Type==='int'?'0':'""'})`,'ok');
};
window.fillRandom=function(){
  if(!arr1.length){log1('❌ 먼저 배열을 생성하세요.','err');return;}
  if(arr1Type==='int'){arr1=arr1.map(()=>Math.floor(Math.random()*100));}
  else{const ns=['사과','바나나','딸기','포도','수박','오렌지','키위','망고','체리','레몬'];arr1=arr1.map((_,i)=>ns[i%ns.length]);}
  renderArr1();log1('🎲 랜덤 값으로 채워졌습니다: ['+arr1.join(', ')+']','ok');
};
window.setArrVal=function(){
  const idx=parseInt(document.getElementById('setIdx').value);
  let val=document.getElementById('setVal').value;
  if(idx<0||idx>=arr1.length){log1(`❌ IndexOutOfRangeException: 인덱스 ${idx}는 범위 밖입니다! (0~${arr1.length-1})`,'err');return;}
  if(arr1Type==='int'){val=parseInt(val);if(isNaN(val)){log1('❌ FormatException: int 타입에는 숫자만 입력 가능합니다.','err');return;}}
  arr1[idx]=val;renderArr1(idx);log1(`✅ array[${idx}] = ${JSON.stringify(val)}`,'ok');
};
function renderArr1(hl=-1){
  const v=document.getElementById('vis1');if(!v)return;
  v.innerHTML=arr1.map((x,i)=>`<div class="arr-cell${i===hl?' highlight':''}">${arr1Type==='int'?x:`"${x}"`}<span class="idx">[${i}]</span></div>`).join('');
}
function log1(msg,cls){
  const l=document.getElementById('log1');if(!l)return;
  l.innerHTML+=`<div class="${cls}">${msg}</div>`;l.scrollTop=l.scrollHeight;
}

// ========== 2. 요소 접근/수정 ==========
pages.p2=function(){
  arr2=[10,20,30,40,50];
  return `
<h2>🔍 2. 배열 요소 접근과 수정</h2>
<p class="desc">인덱스를 통해 배열 요소에 접근하고 수정하는 방법을 학습합니다. C# 배열은 <b>0부터</b> 시작합니다!</p>

<div class="panel">
  <div class="panel-title">💡 C# 코드 예시</div>
  <div class="code-block"><span class="tp">int</span>[] arr = { <span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>, <span class="num">50</span> };

<span class="cm">// 읽기</span>
<span class="tp">int</span> first = arr[<span class="num">0</span>];     <span class="cm">// 10</span>
<span class="tp">int</span> last = arr[<span class="num">4</span>];      <span class="cm">// 50</span>
<span class="tp">int</span> len = arr.<span class="fn">Length</span>;   <span class="cm">// 5</span>

<span class="cm">// 쓰기</span>
arr[<span class="num">2</span>] = <span class="num">99</span>;             <span class="cm">// {10, 20, 99, 40, 50}</span>

<span class="cm">// ⚠️ 주의! 범위 초과 → 예외 발생</span>
<span class="cm">// arr[5] = 60;  → IndexOutOfRangeException!</span></div>
</div>

<div class="panel">
  <div class="panel-title">🎮 인덱스로 접근하기</div>
  <div class="array-vis" id="vis2"></div>
  <div class="flex-row">
    <label>arr[</label>
    <input type="number" id="acc_idx" value="0" min="-1" max="10" style="width:60px"/>
    <label>]</label>
    <button class="btn btn-primary" onclick="readArr2()">읽기 (Read)</button>
    <label>=</label>
    <input type="number" id="acc_val" value="0" style="width:80px"/>
    <button class="btn btn-success" onclick="writeArr2()">쓰기 (Write)</button>
  </div>
  <div id="res2" style="margin-top:8px"></div>
  <div class="log" id="log2" style="margin-top:12px"></div>
</div>
`};

let arr2=[10,20,30,40,50];
window.readArr2=function(){
  const idx=parseInt(document.getElementById('acc_idx').value);
  renderArr2(idx);
  if(idx<0||idx>=arr2.length){
    document.getElementById('res2').innerHTML=`<div class="result-box result-err">💥 IndexOutOfRangeException!<br>인덱스 ${idx}는 유효 범위(0~${arr2.length-1})를 벗어났습니다.</div>`;
    log2(`❌ arr[${idx}] → IndexOutOfRangeException`,'err');
  }else{
    document.getElementById('res2').innerHTML=`<div class="result-box result-ok">arr[${idx}] = ${arr2[idx]}</div>`;
    log2(`✅ arr[${idx}] → ${arr2[idx]}`,'ok');
  }
};
window.writeArr2=function(){
  const idx=parseInt(document.getElementById('acc_idx').value);
  const val=parseInt(document.getElementById('acc_val').value);
  if(idx<0||idx>=arr2.length){
    document.getElementById('res2').innerHTML=`<div class="result-box result-err">💥 IndexOutOfRangeException!<br>쓰기 실패: 인덱스 ${idx}는 범위 밖입니다.</div>`;
    log2(`❌ arr[${idx}] = ${val} → IndexOutOfRangeException`,'err');renderArr2(idx);return;
  }
  if(isNaN(val)){log2('❌ FormatException','err');return;}
  const old=arr2[idx];arr2[idx]=val;renderArr2(idx);
  document.getElementById('res2').innerHTML=`<div class="result-box result-ok">arr[${idx}]: ${old} → ${val} (수정 완료)</div>`;
  log2(`✅ arr[${idx}] = ${val} (이전: ${old})`,'ok');
};
function renderArr2(hl=-1){
  const v=document.getElementById('vis2');if(!v)return;
  v.innerHTML=arr2.map((x,i)=>`<div class="arr-cell${i===hl?' highlight':''}">${x}<span class="idx">[${i}]</span></div>`).join('');
}
function log2(msg,cls){const l=document.getElementById('log2');if(!l)return;l.innerHTML+=`<div class="${cls}">${msg}</div>`;l.scrollTop=l.scrollHeight;}

// ========== 3. 반복문 순회 ==========
pages.p3=function(){
  arr3=[15,27,33,41,58,62,79];
  return `
<h2>🔄 3. 반복문으로 배열 순회</h2>
<p class="desc">for, foreach 문을 사용하여 배열의 모든 요소를 순회하는 방법을 학습합니다.</p>

<div class="panel">
  <div class="panel-title">💡 C# 코드 예시</div>
  <div class="code-block"><span class="tp">int</span>[] arr = { <span class="num">15</span>, <span class="num">27</span>, <span class="num">33</span>, <span class="num">41</span>, <span class="num">58</span>, <span class="num">62</span>, <span class="num">79</span> };

<span class="cm">// for 문</span>
<span class="kw">for</span> (<span class="tp">int</span> i = <span class="num">0</span>; i < arr.<span class="fn">Length</span>; i++)
{
    Console.<span class="fn">WriteLine</span>(<span class="str">$"arr[{i}] = {arr[i]}"</span>);
}

<span class="cm">// foreach 문</span>
<span class="kw">foreach</span> (<span class="tp">int</span> num <span class="kw">in</span> arr)
{
    Console.<span class="fn">WriteLine</span>(num);
}

<span class="cm">// 합계 & 평균</span>
<span class="tp">int</span> sum = <span class="num">0</span>;
<span class="kw">foreach</span> (<span class="tp">int</span> n <span class="kw">in</span> arr) sum += n;
<span class="tp">double</span> avg = (<span class="tp">double</span>)sum / arr.<span class="fn">Length</span>;</div>
</div>

<div class="panel">
  <div class="panel-title">🎮 순회 애니메이션</div>
  <div class="array-vis" id="vis3"></div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="iterFor()">▶ for 문 실행</button>
    <button class="btn btn-info" onclick="iterForeach()">▶ foreach 실행</button>
    <button class="btn btn-success" onclick="calcSum()">∑ 합계/평균</button>
    <button class="btn btn-danger" onclick="resetIter()">↺ 리셋</button>
  </div>
  <div class="log" id="log3"></div>
</div>
`};

let arr3=[15,27,33,41,58,62,79];let iterTimer=null;
function renderArr3(hl=-1){
  const v=document.getElementById('vis3');if(!v)return;
  v.innerHTML=arr3.map((x,i)=>`<div class="arr-cell${i===hl?' highlight':''}">${x}<span class="idx">[${i}]</span></div>`).join('');
}
window.iterFor=function(){
  if(iterTimer)return;let i=0;
  log3('📌 for (int i = 0; i < arr.Length; i++)','info');
  iterTimer=setInterval(()=>{
    if(i>=arr3.length){clearInterval(iterTimer);iterTimer=null;log3('✅ 순회 완료!','ok');renderArr3();return;}
    renderArr3(i);log3(`   arr[${i}] = ${arr3[i]}`,'ok');i++;
  },500);
};
window.iterForeach=function(){
  if(iterTimer)return;let i=0;
  log3('📌 foreach (int num in arr)','info');
  iterTimer=setInterval(()=>{
    if(i>=arr3.length){clearInterval(iterTimer);iterTimer=null;log3('✅ 순회 완료!','ok');renderArr3();return;}
    renderArr3(i);log3(`   num = ${arr3[i]}`,'ok');i++;
  },500);
};
window.calcSum=function(){
  const sum=arr3.reduce((a,b)=>a+b,0);
  const avg=(sum/arr3.length).toFixed(1);
  log3(`∑ 합계 = ${sum}, 평균 = ${avg}`,'ok');
};
window.resetIter=function(){if(iterTimer){clearInterval(iterTimer);iterTimer=null;}renderArr3();document.getElementById('log3').innerHTML='';};
function log3(msg,cls){const l=document.getElementById('log3');if(!l)return;l.innerHTML+=`<div class="${cls}">${msg}</div>`;l.scrollTop=l.scrollHeight;}

// ========== 4. 배열 정렬 ==========
pages.p4=function(){
  arr4=[64,34,25,12,22,11,90,45];
  return `
<h2>📊 4. 배열 정렬</h2>
<p class="desc">Array.Sort()와 버블 정렬 알고리즘을 통해 배열을 정렬하는 방법을 학습합니다.</p>

<div class="panel">
  <div class="panel-title">💡 C# 코드 예시</div>
  <div class="code-block"><span class="tp">int</span>[] arr = { <span class="num">64</span>, <span class="num">34</span>, <span class="num">25</span>, <span class="num">12</span>, <span class="num">22</span>, <span class="num">11</span>, <span class="num">90</span>, <span class="num">45</span> };

<span class="cm">// 방법 1: 내장 메서드</span>
<span class="tp">Array</span>.<span class="fn">Sort</span>(arr);          <span class="cm">// 오름차순 정렬</span>
<span class="tp">Array</span>.<span class="fn">Reverse</span>(arr);       <span class="cm">// 내림차순</span>

<span class="cm">// 방법 2: 버블 정렬 직접 구현</span>
<span class="kw">for</span> (<span class="tp">int</span> i = <span class="num">0</span>; i < arr.<span class="fn">Length</span> - <span class="num">1</span>; i++)
{
    <span class="kw">for</span> (<span class="tp">int</span> j = <span class="num">0</span>; j < arr.<span class="fn">Length</span> - <span class="num">1</span> - i; j++)
    {
        <span class="kw">if</span> (arr[j] > arr[j + <span class="num">1</span>])
        {
            <span class="tp">int</span> temp = arr[j];
            arr[j] = arr[j + <span class="num">1</span>];
            arr[j + <span class="num">1</span>] = temp;
        }
    }
}</div>
</div>

<div class="panel">
  <div class="panel-title">🎮 정렬 시각화</div>
  <div id="vis4" style="display:flex;gap:4px;align-items:flex-end;min-height:120px;margin-bottom:16px"></div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="bubbleSort4()">▶ 버블 정렬</button>
    <button class="btn btn-info" onclick="arraySort4()">⚡ Array.Sort()</button>
    <button class="btn btn-danger" onclick="resetSort4()">↺ 섞기</button>
  </div>
  <div class="log" id="log4"></div>
</div>
`};

let arr4=[64,34,25,12,22,11,90,45];let sortTimer=null;
function renderArr4(hl1=-1,hl2=-1,sorted=[]){
  const v=document.getElementById('vis4');if(!v)return;
  const mx=Math.max(...arr4);
  v.innerHTML=arr4.map((x,i)=>{
    const h=Math.max(30, (x/mx)*110);
    let cls='';if(sorted.includes(i))cls=' sorted';if(i===hl1||i===hl2)cls=' highlight';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div class="arr-cell${cls}" style="width:100%;height:${h}px;min-width:0;font-size:13px">${x}</div><span style="font-size:10px;color:#585b70">[${i}]</span></div>`;
  }).join('');
}
window.bubbleSort4=function(){
  if(sortTimer)return;
  const a=[...arr4];const steps=[];
  for(let i=0;i<a.length-1;i++){
    for(let j=0;j<a.length-1-i;j++){
      steps.push({j,j1:j+1,swap:a[j]>a[j+1],arr:[...a],sorted:a.length-1-i});
      if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];}
    }
  }
  steps.push({done:true,arr:[...a]});
  let si=0;
  log4('📌 버블 정렬 시작...','info');
  sortTimer=setInterval(()=>{
    if(si>=steps.length){clearInterval(sortTimer);sortTimer=null;return;}
    const s=steps[si];
    if(s.done){arr4=[...s.arr];renderArr4(-1,-1,arr4.map((_,i)=>i));log4('✅ 정렬 완료! ['+arr4.join(', ')+']','ok');}
    else{arr4=[...s.arr];if(s.swap){[arr4[s.j],arr4[s.j1]]=[arr4[s.j1],arr4[s.j]];log4(`🔄 swap arr[${s.j}]↔arr[${s.j1}]`,'info');}
    const sorted=[];for(let k=s.sorted;k<arr4.length;k++)sorted.push(k);renderArr4(s.j,s.j1,sorted);}
    si++;
  },200);
};
window.arraySort4=function(){
  arr4.sort((a,b)=>a-b);renderArr4(-1,-1,arr4.map((_,i)=>i));log4('⚡ Array.Sort() → ['+arr4.join(', ')+']','ok');
};
window.resetSort4=function(){
  if(sortTimer){clearInterval(sortTimer);sortTimer=null;}
  arr4=arr4.map(()=>Math.floor(Math.random()*90)+10);renderArr4();
  log4('🔀 배열이 섞였습니다: ['+arr4.join(', ')+']','info');
};
function log4(msg,cls){const l=document.getElementById('log4');if(!l)return;l.innerHTML+=`<div class="${cls}">${msg}</div>`;l.scrollTop=l.scrollHeight;}
